name: CI

on:
  push:
    branches: [main]
  pull_request:

# M0 ships verify, test, and security only (docs/11-ci-release.md).
# determinism, e2e, integration, and mutation jobs land with the milestones
# that give them something real to run against (docs/09-roadmap-mvp.md).

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Build first: packages resolve each other through their package.json
      # "exports" (-> dist/*.d.ts), so on a fresh checkout with no dist/,
      # both eslint's type-aware rules and tsc see cross-package imports as
      # unresolved/`any` unless the workspace is built first.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Same reason as verify: cross-package imports resolve through
      # dist/*.js at runtime, which doesn't exist on a fresh checkout.
      - run: pnpm build
      # packages/registry's abi.drift.test.ts reads contracts/out/ (docs/12:
      # "a test fails if the TS ABI and the compiled ABI drift") -- nothing
      # else in this job builds Solidity, so do it explicitly.
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
        working-directory: contracts
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: coverage, path: "packages/*/coverage/lcov.info" }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - name: gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact -v
